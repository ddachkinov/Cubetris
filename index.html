<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cubetris</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; }
      canvas { display: block; }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #hud {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #fff;
        font-size: 18px;
      }
      #hud span { display: block; margin-bottom: 6px; }
      #next-preview {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 80px;
        height: 80px;
        border: 2px solid rgba(255,255,255,0.3);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #next-color-box {
        width: 50px;
        height: 50px;
        border-radius: 6px;
      }
      #next-label {
        position: absolute;
        top: 104px;
        right: 20px;
        width: 80px;
        text-align: center;
        color: rgba(255,255,255,0.6);
        font-size: 12px;
      }
      #game-over-screen {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.8);
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      #game-over-screen h1 { font-size: 48px; margin-bottom: 10px; }
      #game-over-screen p { font-size: 24px; margin-bottom: 30px; }
      #game-over-screen button {
        font-size: 20px;
        padding: 12px 32px;
        border: none;
        border-radius: 6px;
        background: #4a9eff;
        color: #fff;
        cursor: pointer;
      }
      #game-over-screen button:hover { background: #3a8eef; }
      #column-indicator {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.6);
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="hud">
        <span>Score: <strong id="score-val">0</strong></span>
      </div>
      <div id="next-preview">
        <div id="next-color-box"></div>
      </div>
      <div id="next-label">NEXT</div>
      <div id="column-indicator">← A/D or Arrow Keys → | SPACE to shoot</div>
      <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p>Score: <strong id="final-score">0</strong></p>
        <button id="restart-btn">Play Again</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
