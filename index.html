<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#08141f" />
    <title>Cubetris</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #111; font-family: 'Segoe UI', sans-serif; }
      canvas { display: block; }
      #ui {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      /* ─── Top bar ─────────────────────────────────────────────────
         Everything the player reads at a glance lives in one row that
         respects the notch/Dynamic Island and the home indicator. */
      #topbar {
        position: absolute;
        top: 0; left: 0; right: 0;
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
        padding: calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right))
                 12px calc(16px + env(safe-area-inset-left));
        color: #fff;
      }
      .bar-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; }
      .bar-slot.left { align-items: flex-start; }
      .bar-slot.right { align-items: flex-end; }
      .bar-caption {
        font-size: 10px;
        letter-spacing: 1.5px;
        color: rgba(255,255,255,0.45);
      }
      #score-val {
        font-size: 30px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1;
      }
      #score-sub {
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: rgba(255,255,255,0.5);
      }
      #level-val { color: #7bf; font-weight: 700; }
      #daily-indicator { color: #ffd166; font-weight: 700; font-size: 13px; }
      #daily-indicator[hidden] { display: none; }

      /* Hold + next: colour chips, no keyboard letters */
      #hold-preview {
        width: 42px; height: 42px;
        border-radius: 10px;
        border: 2px dashed rgba(255,255,255,0.35);
        pointer-events: auto;
        cursor: pointer;
      }
      #queue-preview { display: flex; align-items: center; gap: 6px; }
      .q-slot { width: 42px; height: 42px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.3); }
      .q-slot.small { width: 30px; height: 30px; opacity: 0.75; }
      .q-slot.tiny { width: 22px; height: 22px; opacity: 0.5; }

      /* Pause + daily: small glyphs, out of the way of the thumb */
      .glyph-btn {
        width: 34px; height: 34px;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 9px;
        background: rgba(0,0,0,0.25);
        color: rgba(255,255,255,0.75);
        font-size: 15px;
        cursor: pointer;
        pointer-events: auto;
        display: flex; align-items: center; justify-content: center;
      }
      .glyph-btn:hover { background: rgba(255,255,255,0.1); }
      #glyph-row { display: flex; gap: 8px; }

      /* ─── Wall timer ──────────────────────────────────────────────
         The wall was on a hidden timer with only a 3s border flash. It
         is now always visible: a bar that drains toward the advance. */
      #wall-timer {
        position: absolute;
        left: calc(16px + env(safe-area-inset-left));
        right: calc(16px + env(safe-area-inset-right));
        top: calc(74px + env(safe-area-inset-top));
        height: 3px;
        border-radius: 2px;
        background: rgba(255,255,255,0.12);
        overflow: hidden;
      }
      #wall-timer-fill {
        height: 100%;
        width: 100%;
        transform-origin: left center;
        background: #7bf;
        transition: background-color 0.3s;
      }
      #wall-timer.imminent #wall-timer-fill { background: #ff4444; }

      /* First-run hint — appears only if an untouched board sits idle */
      #hint {
        position: absolute;
        left: 50%;
        bottom: calc(64px + env(safe-area-inset-bottom));
        transform: translateX(-50%);
        padding: 10px 18px;
        border-radius: 999px;
        background: rgba(0,0,0,0.55);
        color: rgba(255,255,255,0.9);
        font-size: 14px;
        white-space: nowrap;
        opacity: 0;
        transition: opacity 0.4s;
      }
      #hint.show { opacity: 1; }
      /* Pause screen */
      #pause-screen {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.75);
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
        z-index: 50;
        gap: 16px;
      }
      #pause-screen h1 { font-size: 48px; margin-bottom: 10px; color: #7bf; }
      #pause-screen button {
        font-size: 20px;
        padding: 12px 32px;
        border: none;
        border-radius: 6px;
        background: #4a9eff;
        color: #fff;
        cursor: pointer;
        min-width: 180px;
      }
      #pause-screen button:hover { background: #3a8eef; }
      #pause-screen .btn-restart { background: #555; }
      #pause-screen .btn-restart:hover { background: #666; }
      /* Game over */
      #game-over-screen {
        display: none;
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.85);
        color: #fff;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        pointer-events: auto;
      }
      #game-over-screen h1 { font-size: 48px; margin-bottom: 10px; }
      #game-over-screen p { font-size: 24px; margin-bottom: 8px; }
      #game-over-screen .best-line { font-size: 16px; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
      #new-best {
        display: none;
        font-size: 20px;
        font-weight: 900;
        color: #ffe055;
        text-shadow: 0 0 12px rgba(255,224,85,0.6);
        margin-bottom: 16px;
        animation: best-pulse 0.6s ease-in-out infinite alternate;
      }
      @keyframes best-pulse {
        from { transform: scale(1); }
        to   { transform: scale(1.12); }
      }
      #game-over-screen button {
        font-size: 20px;
        padding: 12px 32px;
        border: none;
        border-radius: 6px;
        background: #4a9eff;
        color: #fff;
        cursor: pointer;
        margin-top: 10px;
      }
      #game-over-screen button:hover { background: #3a8eef; }
      /* Score popups */
      .score-popup {
        position: absolute;
        pointer-events: none;
        font-weight: 900;
        font-size: 22px;
        color: #ffe055;
        text-shadow: 0 0 6px rgba(255,224,85,0.7), 0 1px 2px rgba(0,0,0,0.5);
        animation: score-float 0.9s ease-out forwards;
        z-index: 10;
        white-space: nowrap;
      }
      .score-popup.combo {
        font-size: 30px;
        color: #ff6ef5;
        text-shadow: 0 0 10px rgba(255,110,245,0.8), 0 0 20px rgba(255,110,245,0.4);
      }
      .score-popup.row-clear {
        font-size: 28px;
        color: #4f4;
        text-shadow: 0 0 10px rgba(68,255,68,0.8), 0 0 20px rgba(68,255,68,0.4);
      }
      @keyframes score-float {
        0%   { opacity: 1; transform: translateY(0) scale(1.2); }
        30%  { opacity: 1; transform: translateY(-20px) scale(1); }
        100% { opacity: 0; transform: translateY(-60px) scale(0.8); }
      }
      /* Level-up announcement */
      #level-up {
        display: none;
        position: absolute;
        top: 40%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 42px;
        font-weight: 900;
        color: #7bf;
        text-shadow: 0 0 20px rgba(119,187,255,0.7), 0 0 40px rgba(119,187,255,0.3);
        pointer-events: none;
        z-index: 15;
        animation: lvlup 1.4s ease-out forwards;
      }
      @keyframes lvlup {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        30%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        75%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(0.9); }
      }
      /* Row clear banner */
      #row-clear {
        display: none;
        position: absolute;
        top: 48%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 34px;
        font-weight: 900;
        color: #4f4;
        text-shadow: 0 0 15px rgba(68,255,68,0.7), 0 0 30px rgba(68,255,68,0.3);
        pointer-events: none;
        z-index: 15;
        white-space: nowrap;
      }
      @keyframes rowclear {
        0%   { opacity: 0; transform: translate(-50%, -50%) scaleX(0.3); }
        15%  { opacity: 1; transform: translate(-50%, -50%) scaleX(1.1); }
        25%  { opacity: 1; transform: translate(-50%, -50%) scaleX(1); }
        70%  { opacity: 1; }
        100% { opacity: 0; }
      }
      /* Wall advance warning flash */
      #wall-warning {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        border: 3px solid transparent;
        box-sizing: border-box;
        transition: border-color 0.15s;
        z-index: 5;
      }
      #wall-warning.active {
        border-color: rgba(255, 34, 34, 0.6);
        animation: warn-pulse 0.6s ease-in-out infinite;
      }
      @keyframes warn-pulse {
        0%, 100% { border-color: rgba(255, 34, 34, 0.15); }
        50%      { border-color: rgba(255, 34, 34, 0.6); }
      }
      /* Zone bar */
      #zone-bar {
        position: absolute;
        bottom: calc(50px + env(safe-area-inset-bottom));
        left: calc(16px + env(safe-area-inset-left));
        width: 16px;
        height: 200px;
        background: rgba(255,255,255,0.1);
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.2);
        pointer-events: auto; /* tappable on mobile */
        cursor: pointer;
      }
      #zone-fill {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 0%;
        background: linear-gradient(to top, #4488ff, #88ccff);
        border-radius: 3px;
        transition: height 0.3s ease-out;
      }
      #zone-bar.active #zone-fill {
        background: linear-gradient(to top, #ff8800, #ffcc00);
        box-shadow: 0 0 12px rgba(255,200,0,0.6);
      }
      #zone-bar.charged #zone-fill {
        background: linear-gradient(to top, #44ff88, #88ffcc);
        box-shadow: 0 0 8px rgba(68,255,136,0.5);
        animation: zone-pulse 0.8s ease-in-out infinite alternate;
      }
      @keyframes zone-pulse {
        from { box-shadow: 0 0 4px rgba(68,255,136,0.3); }
        to { box-shadow: 0 0 14px rgba(68,255,136,0.8); }
      }
      #zone-label {
        position: absolute;
        bottom: calc(34px + env(safe-area-inset-bottom));
        left: calc(12px + env(safe-area-inset-left));
        color: rgba(255,255,255,0.4);
        font-size: 10px;
        letter-spacing: 1px;
        pointer-events: none;
      }
      /* Zone banner */
      #zone-banner {
        display: none;
        position: absolute;
        top: 35%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 48px;
        font-weight: 900;
        color: #ffcc00;
        text-shadow: 0 0 30px rgba(255,200,0,0.8), 0 0 60px rgba(255,200,0,0.4);
        pointer-events: none;
        z-index: 15;
      }
      @keyframes zone-activate {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
        20%  { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
        35%  { transform: translate(-50%, -50%) scale(1); }
        70%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(0.8); }
      }
      /* Chain counter */
      #chain-counter {
        display: none;
        position: absolute;
        top: 28%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 56px;
        font-weight: 900;
        pointer-events: none;
        z-index: 14;
        color: #ff6ef5;
        text-shadow: 0 0 20px rgba(255,110,245,0.8), 0 0 40px rgba(255,110,245,0.3);
      }
      @keyframes chain-pop {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
        15%  { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
        30%  { transform: translate(-50%, -50%) scale(1); }
        80%  { opacity: 1; }
        100% { opacity: 0; transform: translate(-50%, -60%) scale(0.7); }
      }
      /* Flash overlay */
      #flash-overlay {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        background: white;
        opacity: 0;
        z-index: 4;
        transition: opacity 0.05s;
      }
      /* Zone active vignette effect */
      body.zone-active #flash-overlay {
        box-shadow: inset 0 0 100px rgba(255,200,0,0.15);
      }
      body.zone-active canvas {
        filter: saturate(1.3) brightness(1.05);
      }
      /* Danger vignette — heartbeat red edges when cubes near the front */
      #danger-vignette {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 6;
        opacity: 0;
        transition: opacity 0.4s;
        box-shadow: inset 0 0 120px rgba(255, 20, 20, 0.45);
      }
      body.danger #danger-vignette {
        opacity: 1;
        animation: danger-pulse 0.9s ease-in-out infinite;
      }
      @keyframes danger-pulse {
        0%, 100% { box-shadow: inset 0 0 100px rgba(255, 20, 20, 0.3); }
        50%      { box-shadow: inset 0 0 160px rgba(255, 20, 20, 0.55); }
      }
      /* Clutch save banner */
      #clutch-banner {
        display: none;
        position: absolute;
        top: 42%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-size: 40px;
        font-weight: 900;
        color: #66ffe0;
        text-shadow: 0 0 18px rgba(102,255,224,0.8), 0 0 40px rgba(102,255,224,0.4);
        pointer-events: none;
        z-index: 16;
        white-space: nowrap;
      }
      /* Badge toast */
      #badge-toast {
        display: none;
        position: absolute;
        bottom: 90px;
        left: 50%;
        transform: translateX(-50%);
        padding: 8px 20px;
        border-radius: 20px;
        background: rgba(0,0,0,0.6);
        border: 1px solid rgba(255,224,85,0.5);
        color: #ffe055;
        font-size: 16px;
        font-weight: 700;
        pointer-events: none;
        z-index: 20;
        white-space: nowrap;
      }
      @keyframes badge-in {
        0%   { opacity: 0; transform: translateX(-50%) translateY(20px); }
        12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
        80%  { opacity: 1; }
        100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
      }
      /* Game-over extras */
      #run-stats { font-size: 15px; color: rgba(255,255,255,0.65); margin-bottom: 6px; }
      #run-badges { font-size: 14px; color: #ffe055; margin-bottom: 10px; }
      #daily-result { display: none; font-size: 15px; color: #ffd166; margin-bottom: 8px; }
      .retry-hint { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 14px; }
    </style>
  </head>
  <body>
    <div id="ui">
      <div id="topbar">
        <div class="bar-slot left">
          <div id="hold-preview"></div>
          <span class="bar-caption">HOLD</span>
        </div>
        <div class="bar-slot">
          <strong id="score-val">0</strong>
          <span id="score-sub">Best <strong id="best-val">0</strong> · <span id="level-val">Level 1</span></span>
          <span id="daily-indicator" hidden>DAILY RUN</span>
          <div id="glyph-row">
            <button id="pause-btn" class="glyph-btn" aria-label="Pause">| |</button>
            <button id="daily-btn" class="glyph-btn" aria-label="Daily challenge">&#128197;</button>
          </div>
        </div>
        <div class="bar-slot right">
          <div id="queue-preview">
            <div class="q-slot tiny" id="q-slot-2"></div>
            <div class="q-slot small" id="q-slot-1"></div>
            <div class="q-slot" id="q-slot-0"></div>
          </div>
          <span class="bar-caption">NEXT</span>
        </div>
      </div>
      <div id="wall-timer"><div id="wall-timer-fill"></div></div>
      <div id="hint">Drag to aim · release to drop</div>
      <div id="danger-vignette"></div>
      <div id="clutch-banner"></div>
      <div id="badge-toast"></div>
      <div id="flash-overlay"></div>
      <div id="wall-warning"></div>
      <div id="zone-bar">
        <div id="zone-fill"></div>
      </div>
      <div id="zone-label">ZONE</div>
      <div id="zone-banner"></div>
      <div id="chain-counter"></div>
      <div id="level-up"></div>
      <div id="row-clear"></div>
      <div id="pause-screen">
        <h1>PAUSED</h1>
        <button id="resume-btn">Resume</button>
        <button id="pause-restart-btn" class="btn-restart">Restart</button>
      </div>
      <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <p>Score: <strong id="final-score">0</strong></p>
        <p class="best-line">Best: <strong id="final-best">0</strong></p>
        <div id="new-best">NEW BEST!</div>
        <p id="run-stats"></p>
        <p id="run-badges"></p>
        <p id="daily-result"></p>
        <button id="restart-btn">Play Again</button>
        <p class="retry-hint">Tap the board to try again</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
